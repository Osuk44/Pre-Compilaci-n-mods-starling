name: Build Atlas Mod (.hnmod)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout horizon-atlas source
        uses: actions/checkout@v4
        with:
          repository: MrCloudy2/horizon-atlas
          ref: v0.2.0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Run packaging script
        run: |
          set -e
          # Ejecutar el script oficial provisto por el repositorio para generar el .hnmod
          python3 tools/package.py
          
          # Crear carpeta de distribución y mover el archivo generado
          mkdir -p dist
          find . -name "*.hnmod" -exec cp {} dist/ \;

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: atlas-hnmod-android
          path: dist/*.hnmod


