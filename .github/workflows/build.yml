name: Build Atlas Mod (.hnmod)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout horizon-atlas source
        uses: actions/checkout@v4
        with:
          repository: MrCloudy2/horizon-atlas
          ref: v0.2.0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install Cargo NDK
        run: cargo install cargo-ndk

      - name: Setup Android NDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 8512546
          ndk-version: 25.2.9519653
          packages: "build-tools;33.0.2 platforms;android-33 platform-tools"

      - name: Compile native library for Android
        run: |
          set -e
          cargo ndk -t aarch64-linux-android build --release

      - name: Run packaging script
        run: |
          set -e
          python3 tools/package.py
          mkdir -p dist
          find . -name "*.hnmod" -exec cp {} dist/ \;

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: atlas-hnmod-android
          path: dist/*.hnmod
