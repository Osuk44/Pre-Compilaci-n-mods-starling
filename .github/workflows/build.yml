name: Build Atlas Mod (.hnmod)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout horizon-atlas source
        uses: actions/checkout@v4
        with:
          repository: MrCloudy2/horizon-atlas
          ref: v0.2.0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup Android NDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 8512546
          ndk-version: 25.2.9519653
          packages: "build-tools;33.0.2 platforms;android-33 platform-tools"

      - name: Install Cargo NDK
        run: cargo install cargo-ndk

      - name: Configure Cargo.toml for cdylib safely
        run: |
          python3 -c '
          with open("Cargo.toml", "r") as f:
              content = f.read()

          # Agregar name y crate-type a la sección [lib] existente sin duplicarla
          target_str = "[lib]"
          replacement = "[lib]\nname = \"atlas\"\ncrate-type = [\"cdylib\"]"

          if target_str in content and "crate-type" not in content:
              content = content.replace(target_str, replacement, 1)
              with open("Cargo.toml", "w") as f:
                  f.write(content)
              print("Cargo.toml configurado correctamente con cdylib.")
          else:
              print("La sección [lib] ya está configurada o no se encontró.")
          '

      - name: Compile native library for Android
        run: |
          set -e
          cargo ndk -t aarch64-linux-android --platform 33 build --release

      - name: Locate and Package .hnmod
        run: |
          set -e
          mkdir -p dist
          
          SO_FILE=$(find target -name "*.so" | head -n 1)
          if [ -z "$SO_FILE" ]; then
            echo "ERROR CRITICO: Ningún archivo .so fue compilado."
            exit 1
          fi
          
          cp "$SO_FILE" dist/libatlas.so
          echo -e '[mod]\nid = "atlas"\nname = "Atlas Minimap"\nversion = "0.2.0"\ntarget_game_version = "0.2.3"' > dist/mod.toml
          
          cd dist && zip -r ../atlas-v0.2.0.hnmod .

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: atlas-hnmod-android
          path: atlas-v0.2.0.hnmod
