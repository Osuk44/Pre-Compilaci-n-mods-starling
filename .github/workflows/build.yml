name: Build and Release Atlas Mod for Starling

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout horizon-atlas source
        uses: actions/checkout@v4
        with:
          repository: MrCloudy2/horizon-atlas
          ref: v0.2.0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup Android NDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 8512546
          ndk-version: 25.2.9519653
          packages: "build-tools;33.0.2 platforms;android-33 platform-tools"

      - name: Install Cargo NDK
        run: cargo install cargo-ndk

      - name: Configure Cargo.toml for cdylib safely
        run: |
          python3 -c '
          with open("Cargo.toml", "r") as f:
              content = f.read()

          target_str = "[lib]"
          replacement = "[lib]\nname = \"atlas\"\ncrate-type = [\"cdylib\"]"

          if target_str in content and "crate-type" not in content:
              content = content.replace(target_str, replacement, 1)
              with open("Cargo.toml", "w") as f:
                  f.write(content)
          '

      - name: Compile native library for Android
        run: |
          set -e
          cargo ndk -t aarch64-linux-android --platform 33 build --release

      - name: Locate and Package Mod Structure
        run: |
          set -e
          # Crear la jerarquía interna requerida por el gestor de mods
          mkdir -p dist/mods/atlas
          
          SO_FILE=$(find target -name "*.so" | head -n 1)
          if [ -z "$SO_FILE" ]; then
            echo "ERROR CRITICO: Ningún archivo .so fue compilado."
            exit 1
          fi
          
          cp "$SO_FILE" dist/mods/atlas/libatlas.so
          echo -e '[mod]\nid = "atlas"\nname = "Atlas Minimap"\nversion = "0.2.0"\ntarget_game_version = "0.2.3"' > dist/mods/atlas/mod.toml
          
          # Comprimir con extensión .starling reconocida por el launcher
          cd dist && zip -r ../atlas-v0.2.0.starling mods/

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: atlas-starling-package
          path: atlas-v0.2.0.starling

      - name: Release to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: atlas-v0.2.0.starling
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
